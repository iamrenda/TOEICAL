name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: toeical_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/toeical_test
            ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-chars
            REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-chars
            FASTAPI_URL: http://127.0.0.1:8000

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Create test schema
              working-directory: sql_test
              run: psql "$DATABASE_URL" -f init.sql
            - name: Run backend tests
              working-directory: backend
              run: npx jest --forceExit
